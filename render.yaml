services:
  - type: web
    name: serategna
    runtime: node
    plan: 0.5c-512mb
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/jobs.json
    disk:
      name: serategna-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.23.4
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: APP_DATA_DIR
        value: /var/data
      - key: ADMIN_PASSWORD
        sync: false
