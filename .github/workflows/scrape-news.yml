name: Refresh Ethiopia news

on:
  workflow_dispatch:
  schedule:
    - cron: "47 * * * *"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out SERATEGNA
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh public Ethiopian news headlines
        run: npm run scrape:news
      - name: Commit refreshed news
        run: |
          git config user.name "SERATEGNA News Indexer"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/news.ts
          git diff --cached --quiet || git commit -m "Refresh Ethiopia news"
          git push
