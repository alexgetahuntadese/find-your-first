name: Post new site jobs to Telegram

on:
  schedule:
    - cron: "45 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/telegram-jobs.yml

permissions:
  contents: read

concurrency:
  group: telegram-new-jobs
  cancel-in-progress: false

jobs:
  post-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the latest site job snapshot
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore posted job IDs
        id: restore-state
        uses: actions/cache/restore@v4
        with:
          path: .telegram-cache/posted-job-ids.json
          key: telegram-job-ids-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            telegram-job-ids-
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair historical Telegram apply buttons
        run: node scripts/post-jobs-to-telegram.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_JOBS_URL: ${{ vars.SITE_JOBS_URL }}
          POSTED_JOB_IDS_FILE: .telegram-cache/posted-job-ids.json
          REPAIR_TELEGRAM_LINKS: "true"
      - name: Save posted job IDs
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .telegram-cache/posted-job-ids.json
          key: telegram-job-ids-${{ github.run_id }}-${{ github.run_attempt }}
