
name: Telegram Channel Posting

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  telegram:
    runs-on: ubuntu-latest

    steps:
      - name: Send Telegram Message
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            --data-urlencode "text=🚀 GitHub automation is connected to @ethioserategna successfully!"
