name: Post new site jobs to Telegram

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_run:
    workflows:
      - Refresh Ethiopian jobs from multiple sources
    types: [completed]
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/post-jobs-to-telegram.mjs

permissions:
  contents: read

concurrency:
  group: telegram-new-jobs
  cancel-in-progress: false

jobs:
  post-jobs:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the latest site job snapshot
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore posted job IDs
        id: restore-state
        uses: actions/cache/restore@v4
        with:
          path: .telegram-cache/posted-job-ids.json
          key: telegram-job-ids-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            telegram-job-ids-
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Post newly listed jobs individually
        run: node scripts/post-jobs-to-telegram.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_JOBS_URL: ${{ vars.SITE_JOBS_URL }}
          POSTED_JOB_IDS_FILE: .telegram-cache/posted-job-ids.json
          BACKFILL_DATE: "2026-11-03"
          BACKFILL_SKIP_URLS: "https://serategna.com.et/jobs/2,https://serategna.com.et/jobs/3,https://serategna.com.et/jobs/5,https://serategna.com.et/jobs/6,https://serategna.com.et/jobs/7"
      - name: Save posted job IDs
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .telegram-cache/posted-job-ids.json
          key: telegram-job-ids-${{ github.run_id }}-${{ github.run_attempt }}
